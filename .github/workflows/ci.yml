name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Install dependensi
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan feature test
        run: php artisan test

  frontend-build:
    name: frontend-build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependensi
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: /api

  deploy:
    name: deploy
    needs: [backend-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buat .env dari GitHub Secrets
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          {
            echo "APP_KEY=$APP_KEY"
            echo "DB_DATABASE=notes"
            echo "DB_USERNAME=notes_user"
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "DB_ROOT_PASSWORD=$DB_PASSWORD"
            echo "VITE_API_URL=/api"
          } > .env

      - name: Smoke test dengan Docker Compose
        run: |
          docker compose up -d --build
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Accept: application/json" http://localhost:8080/api/notes || true)
            [ "$code" = "401" ] && break
            sleep 5
          done
          echo "Status akhir: $code"
          [ "$code" = "401" ]

      - name: Log container jika gagal
        if: failure()
        run: docker compose logs

      - name: Matikan compose
        if: always()
        run: docker compose down -v

      - name: Ubah nama owner ke huruf kecil
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build dan push image backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/uts-kepl-backend:${{ github.sha }}

      - name: Build dan push image frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ghcr.io/${{ env.OWNER }}/uts-kepl-frontend:${{ github.sha }}